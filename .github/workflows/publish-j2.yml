name: Publish verified signed Windows downloads

on:
  workflow_dispatch:
    inputs:
      portable_url:
        description: Temporary HTTPS URL of the already tested Portable ZIP
        required: true
        type: string
      installer_url:
        description: Temporary HTTPS URL of the already tested Installer ZIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dynasty-signed-windows-channel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact previously tested files and verify all hashes
        env:
          DYNASTY_PORTABLE_URL: ${{ inputs.portable_url }}
          DYNASTY_INSTALLER_URL: ${{ inputs.installer_url }}
        run: python3 scripts/prepare-signed-downloads.py
      - name: Read the verified version
        run: |
          python3 - <<'PYVERSION'
          import json, os
          version = json.load(open("tested-release.json"))["version"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("DYNASTY_TAG=v" + version + "\n")
          PYVERSION
      - name: Attach exact tested files to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$DYNASTY_TAG" >/dev/null 2>&1; then
            gh release create "$DYNASTY_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "DYNASTY ${DYNASTY_TAG#v} — Windows et mises à jour" --notes-file RELEASE-NOTES.md
          fi
          test "$(gh release view "$DYNASTY_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$DYNASTY_TAG" downloads/*
      - name: Publish the binaries before the update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$DYNASTY_TAG" --draft=false --prerelease
          if ! gh release view windows-updates >/dev/null 2>&1; then
            gh release create windows-updates --target "$GITHUB_SHA" --draft --prerelease --title "Canal Windows de test — mises à jour signées" --notes "Métadonnées Ed25519 pour les distributions Windows DYNASTY. Les exécutables sont dans les releases versionnées."
          fi
          gh release upload windows-updates downloads/update.json --clobber
          gh release edit windows-updates --draft=false --prerelease
